
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mood Radio</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.8/p5.min.js"></script>
</head>

<body>

    <header>
        <h1>MOOD RADIO</h1>
        <p>What does your mood sound like?</p>
    </header>

    <main>
        <section class="search-section">
            <input
                type="text"
                id="moodInput"
                placeholder="I'm feeling dreamy..."
            >

            <button id="searchButton">Find my music</button>
        </section>

        <p id="message">Enter a mood to begin your listening journey. For example, happy, sad, or energetic.</p>

        <h2 id="playlistTitle"></h2>

        <section id="playlist"></section>
    </main>

    <footer>
        <p>Music discovery powered by Jamendo</p>
    </footer>

    <script src="sketch.js"></script>

</body>
</html>
